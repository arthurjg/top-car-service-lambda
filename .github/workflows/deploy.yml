name: Deploy Lambda CPF Token

on:
  push:
    branches: [main]
    paths:
      - "lambda/**"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "lambda/**"
      - "terraform/**"

permissions:
  id-token: write   # necessário para autenticação OIDC com a AWS
  contents: read
  pull-requests: write # para comentar o plano no PR

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7.5"
  PYTHON_VERSION: "3.12"
  # ARN da role criada no bootstrap (terraform/bootstrap) — configure como
  # variável/secret do repositório em Settings > Secrets and variables
  AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

jobs:
  build:
    name: Build pacotes da Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências em pasta de layer
        run: |
          mkdir -p build/layer/python
          pip install -r lambda/requirements.txt -t build/layer/python

      - name: Empacotar layer (dependências)
        run: |
          cd build/layer
          zip -r ../layer.zip .

      - name: Empacotar código-fonte da Lambda
        run: |
          cd lambda
          zip -r ../build/lambda.zip lambda_function.py

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 1

  terraform:
    name: Terraform Plan/Apply
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artefatos
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: false

      # Em Pull Requests, só faz o plan (não aplica)
      - name: Comentar plano no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Terraform plan executado com sucesso. Revise antes do merge."
            })

      # Só aplica quando for push direto na main
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
